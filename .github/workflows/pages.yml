name: Publier RV-SERVICES sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Préparer le site
        run: node build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Vérifier les pages
        run: node check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v5
